<!doctype html>
<html lang="ms">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASPC Selector Exporter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <img
            class="brand-logo"
            src="assets/logos/aspc-logo-white.png"
            alt="AFTERSHOCK"
          />
          <div>
            <p class="eyebrow">Selector Tool</p>
            <h1>ASPC Selector Exporter</h1>
          </div>
        </div>
        <div class="size-pill">1080 x 1080 px</div>
      </header>

      <section class="workspace">
        <aside class="control-panel" aria-label="Editor controls">
          <section class="panel-section">
            <div class="section-head">
              <h2>Mode</h2>
            </div>
            <div class="mode-tabs" role="tablist" aria-label="Workflow mode">
              <button
                class="mode-tab is-active"
                type="button"
                role="tab"
                aria-selected="true"
                data-mode="generate"
              >
                Generate Selector
              </button>
              <button
                class="mode-tab"
                type="button"
                role="tab"
                aria-selected="false"
                data-mode="overlay"
              >
                Overlay Existing
              </button>
            </div>
          </section>

          <div class="mode-panel is-active" data-mode-panel="generate">
            <section class="panel-section">
              <div class="section-head">
                <h2>Background</h2>
              </div>

              <div class="source-switch" role="group" aria-label="Background source">
                <button
                  class="source-button is-active"
                  type="button"
                  data-background-source="preset"
                >
                  <span class="source-radio" aria-hidden="true"></span>
                  <span>Preset Background</span>
                </button>
                <button class="source-button" type="button" data-background-source="upload">
                  <span class="source-radio" aria-hidden="true"></span>
                  <span>Upload Own</span>
                </button>
              </div>

              <div class="source-panel is-active" data-background-panel="preset">
                <div
                  class="background-list"
                  id="presetBackgroundList"
                  aria-label="Preset background options"
                ></div>
              </div>

              <div class="source-panel" data-background-panel="upload">
                <label class="drop-zone drop-zone-compact" id="backgroundDropZone">
                  <input
                    id="backgroundInput"
                    type="file"
                    accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp"
                  />
                  <span class="drop-icon" data-lucide="image-up" aria-hidden="true"></span>
                  <span class="drop-title">Upload background</span>
                  <span class="drop-subtitle">1080 x 1080 preferred</span>
                </label>
              </div>

              <p class="file-meta" id="backgroundMeta">No background selected</p>
            </section>

            <section class="panel-section">
              <div class="section-head">
                <h2>Product Asset</h2>
              </div>

              <label class="drop-zone drop-zone-compact" id="productDropZone">
                <input
                  id="productInput"
                  type="file"
                  accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp"
                />
                <span class="drop-icon" data-lucide="monitor-up" aria-hidden="true"></span>
                <span class="drop-title">Upload product</span>
                <span class="drop-subtitle">Transparent PNG/WebP works best</span>
              </label>

              <p class="file-meta" id="productMeta">No product selected</p>
            </section>

            <section class="panel-section">
              <div class="section-head">
                <h2>Product Position</h2>
                <button class="mini-action" id="resetProductBtn" type="button">
                  <span data-lucide="crosshair" aria-hidden="true"></span>
                  <span>Reset</span>
                </button>
              </div>

              <div class="range-list">
                <label class="range-row" for="productScale">
                  <span>Scale</span>
                  <input id="productScale" type="range" min="30" max="140" value="78" />
                  <output id="productScaleValue" for="productScale">78%</output>
                </label>
                <label class="range-row" for="productX">
                  <span>X</span>
                  <input id="productX" type="range" min="-360" max="360" value="0" />
                  <output id="productXValue" for="productX">0px</output>
                </label>
                <label class="range-row" for="productY">
                  <span>Y</span>
                  <input id="productY" type="range" min="-360" max="360" value="70" />
                  <output id="productYValue" for="productY">70px</output>
                </label>
              </div>

              <label class="toggle-row" for="productShadow">
                <span>Shadow</span>
                <input id="productShadow" type="checkbox" />
              </label>
            </section>

            <section class="panel-section">
              <div class="section-head">
                <h2>Overlay</h2>
              </div>
              <div
                class="overlay-list"
                id="generateOverlayList"
                aria-label="Generate selector overlay options"
              ></div>
              <div class="custom-overlay-panel" id="generateCustomOverlayPanel">
                <label class="drop-zone drop-zone-compact" id="generateCustomOverlayDropZone">
                  <input
                    id="generateCustomOverlayInput"
                    type="file"
                    accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp"
                  />
                  <span class="drop-icon" data-lucide="layers" aria-hidden="true"></span>
                  <span class="drop-title">Upload custom overlay</span>
                  <span class="drop-subtitle">Best with 1080 x 1080px</span>
                </label>
                <p class="file-meta" id="generateCustomOverlayMeta">
                  No custom overlay selected
                </p>
              </div>
            </section>
          </div>

          <div class="mode-panel" data-mode-panel="overlay">
            <section class="panel-section">
              <div class="section-head">
                <h2>Image</h2>
              </div>

              <label class="drop-zone" id="overlayDropZone">
                <input
                  id="overlayInput"
                  type="file"
                  accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp"
                />
                <span class="drop-icon" data-lucide="upload-cloud" aria-hidden="true"></span>
                <span class="drop-title">Upload image</span>
                <span class="drop-subtitle">PNG, JPEG, WebP</span>
              </label>

              <p class="file-meta" id="overlayMeta">No image selected</p>
            </section>

            <section class="panel-section">
              <div class="section-head">
                <h2>Overlay</h2>
              </div>
              <div class="overlay-list" id="overlayList" aria-label="Overlay options"></div>
              <div class="custom-overlay-panel" id="overlayCustomOverlayPanel">
                <label class="drop-zone drop-zone-compact" id="overlayCustomOverlayDropZone">
                  <input
                    id="overlayCustomOverlayInput"
                    type="file"
                    accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp"
                  />
                  <span class="drop-icon" data-lucide="layers" aria-hidden="true"></span>
                  <span class="drop-title">Upload custom overlay</span>
                  <span class="drop-subtitle">Best with 1080 x 1080px</span>
                </label>
                <p class="file-meta" id="overlayCustomOverlayMeta">
                  No custom overlay selected
                </p>
              </div>
            </section>

            <section class="panel-section">
              <div class="section-head">
                <h2>Frame</h2>
              </div>
              <div class="segmented" role="group" aria-label="Image fit">
                <button class="segment is-active" type="button" data-fit="cover">Crop fill</button>
                <button class="segment" type="button" data-fit="contain">Fit full</button>
              </div>
            </section>
          </div>

          <section class="panel-section">
            <div class="section-head">
              <h2>Export</h2>
            </div>

            <label class="format-row" for="formatSelect">
              <span>Format</span>
              <select id="formatSelect">
                <option value="image/png">PNG</option>
                <option value="image/webp">WebP</option>
              </select>
            </label>

            <button class="primary-action" id="downloadBtn" type="button" disabled>
              <span data-lucide="download" aria-hidden="true"></span>
              <span>Download</span>
            </button>
          </section>
        </aside>

        <section class="preview-panel" aria-label="Preview">
          <div class="preview-toolbar">
            <div>
              <p class="eyebrow">Preview</p>
              <h2 id="previewTitle">Ready</h2>
            </div>
            <button class="icon-button" id="resetBtn" type="button" title="Clear image" disabled>
              <span data-lucide="rotate-ccw" aria-hidden="true"></span>
            </button>
          </div>

          <div class="canvas-wrap" id="canvasWrap">
            <canvas
              id="previewCanvas"
              width="1080"
              height="1080"
              aria-label="Generated product image preview"
            ></canvas>
            <div class="empty-state" id="emptyState">
              <span data-lucide="image-up" aria-hidden="true"></span>
              <span>Upload image</span>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
